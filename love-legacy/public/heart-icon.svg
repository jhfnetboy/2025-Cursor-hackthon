<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="heartGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B9D;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#C44569;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF1744;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="legacyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F8B500;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FF8A80;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C44569;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="innerGlow" cx="50%" cy="35%" r="40%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#FF6B9D;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Outer Glow -->
  <ellipse cx="60" cy="50" rx="50" ry="45" fill="url(#innerGlow)" opacity="0.3"/>

  <!-- Main Heart Shape - Symbol of Love -->
  <path d="M60 90c-2.5-12-10-23-18-29-8-6-18-10-28-10-10 0-20 4-28 10-8 6-15.5 17-18 29h92z"
        fill="url(#heartGradient)"/>
  <path d="M60 25c0-12.5-10-22.5-22.5-22.5S15 12.5 15 25c0 8.5 6.5 16 15.5 20 4 2 8.5 3.5 13.5 3.5s9.5-1.5 13.5-3.5c9-4 15.5-11.5 15.5-20z"
        fill="url(#heartGradient)"/>

  <!-- Heart Outline -->
  <path d="M60 90c-2.5-12-10-23-18-29-8-6-18-10-28-10-10 0-20 4-28 10-8 6-15.5 17-18 29M60 25c0-12.5-10-22.5-22.5-22.5S15 12.5 15 25c0 8.5 6.5 16 15.5 20 4 2 8.5 3.5 13.5 3.5s9.5-1.5 13.5-3.5c9-4 15.5-11.5 15.5-20z"
        stroke="#FF1744"
        stroke-width="3"
        fill="none"
        opacity="0.9"/>

  <!-- Inner Legacy Symbol - Infinity/Eternity -->
  <g transform="translate(35, 45)">
    <!-- Infinity Symbol - Represents Eternal Love -->
    <path d="M0 8c0-4.4 3.6-8 8-8s8 3.6 8 8c0 2.2-0.9 4.2-2.3 5.7l2.3 2.3c2.2-2.2 3.7-5.3 3.7-8.7 0-6.6-5.4-12-12-12s-12 5.4-12 12c0 3.4 1.5 6.5 3.7 8.7l2.3-2.3C0.9 12.2 0 10.2 0 8z"
          fill="url(#legacyGradient)"
          opacity="0.9"/>
    <path d="M8 16c-2.2 0-4-1.8-4-4s1.8-4 4-4 4 1.8 4 4-1.8 4-4 4z"
          fill="url(#legacyGradient)"
          opacity="0.7"/>
  </g>

  <!-- Bridge/Connection Element - Symbol of Passing Love Forward -->
  <g transform="translate(30, 65)">
    <path d="M15 0c-2.8 0-5 2.2-5 5v3h10V5c0-2.8-2.2-5-5-5z" fill="url(#legacyGradient)" opacity="0.8"/>
    <path d="M5 8h30v2H5z" fill="url(#legacyGradient)" opacity="0.6"/>
    <circle cx="8" cy="10" r="1.5" fill="url(#legacyGradient)" opacity="0.7"/>
    <circle cx="27" cy="10" r="1.5" fill="url(#legacyGradient)" opacity="0.7"/>
  </g>

  <!-- Subtle Shine Effects -->
  <ellipse cx="45" cy="35" rx="6" ry="4" fill="#FFFFFF" opacity="0.6"/>
  <ellipse cx="48" cy="38" rx="2" ry="1.5" fill="#FFFFFF" opacity="0.8"/>
</svg>
